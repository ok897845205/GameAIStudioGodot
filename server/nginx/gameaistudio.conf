# Template file. Replace ${...} placeholders before copying this file into Nginx.
server {
    listen ${GAMEAISTUDIO_NGINX_HTTP_PORT};
    server_name ${GAMEAISTUDIO_NGINX_SERVER_NAME};

    root /var/www;
    autoindex off;

    location /gameaistudio/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
}

server {
    listen ${GAMEAISTUDIO_NGINX_DIRECT_PORT};
    server_name ${GAMEAISTUDIO_NGINX_DIRECT_SERVER_NAME};

    root /var/www;
    autoindex off;

    location /gameaistudio/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
}
